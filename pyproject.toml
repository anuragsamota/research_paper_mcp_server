[project]
name = "research-paper-mcp"
version = "0.1.0"
description = "MCP server that lets LLM agents search, retrieve, analyze and compare research papers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.20,<2",
  "httpx>=0.27",
  "numpy>=1.26",
  "pypdf>=4.0",
  "uvicorn>=0.30",
  "starlette>=0.40",
]

[project.optional-dependencies]
# Neural embeddings (recommended for best retrieval quality).
st = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "reportlab>=4.0"]

[project.scripts]
research-mcp = "research_mcp.__main__:main"
research-agent = "research_mcp.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
